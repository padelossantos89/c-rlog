<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="logo.png">
<title>ILECO III · Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="change-password.css">
</head>
<body class="protected amber">
<div class="wm">
  <div class="wm-base"></div>
  <div class="wm-shine"></div>
</div>

<header class="top">
  <div class="brand">
    <div class="mark"></div>
    <span>Iloilo III Electric Cooperative, Inc.</span>
  </div>
  <div class="tag">Complaint &amp; Request Log</div>
</header>
<main>
  <form class="card" id="cp-form" autocomplete="off">
    <h1>Set a new password</h1>
    <p class="sub">This is your first time logging in — choose a new password before continuing.</p>
    <div class="msg-box" id="cp-msg"></div>
    <div class="field">
      <label for="oldPassword">Current (temporary) password</label>
      <input type="password" id="oldPassword" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required autocomplete="new-password" minlength="12" maxlength="128">
    </div>
    <div class="hint">At least 12 characters, with letters and numbers.</div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="12" maxlength="128">
    </div>
    <button type="submit" class="btn" id="cp-btn">Save new password</button>
  </form>
</main>

<footer class="foot">
  <div><strong>ileco3@gmail.com</strong></div>
  <div>Iloilo III Electric Cooperative, Inc.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="change-password.js"></script>
</body>
</html>
